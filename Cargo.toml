[package]
name = "netchat"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
blew = "0.5.0"
ciborium = "0.2.2"
futures-util = "0.3.34"
serde = "1.0.229"
socket2 = "0.6.5"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
uuid = "1.26.1"
zbus = { version = "5", default-features = false, features = ["tokio", "blocking-api"] }
